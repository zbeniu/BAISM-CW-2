format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

app:
  envs:
  - PROJECT_LOCATION: "."
  - MODULE: app
  - VARIANT: debug

# Trigger: Pull Request -> main  =>  workflow safe_build
trigger_map:
- pull_request_target_branch: main
  workflow: safe_build

workflows:
  safe_build:
    title: safe_build
    summary: Clone -> unit testy -> mobsfscan -> build APK -> deploy do bitrise.io
    steps:
    - activate-ssh-key@4:
        run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
    - git-clone@8: {}
    - script@1:
        title: Unit testy (fail pipeline jesli test nie przejdzie)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            chmod +x ./gradlew
            ./gradlew testDebugUnitTest --stacktrace
    - script@1:
        title: mobsfscan (fail pipeline przy findingach o severity ERROR)
        inputs:
        - content: |-
            #!/usr/bin/env bash
            set -euo pipefail
            python3 -m pip install --upgrade mobsfscan
            # skanujemy tylko zrodla aplikacji (nie katalogi build/ z artefaktami posrednimi)
            mobsfscan --type android app/src
    - android-build@1:
        title: Build APK
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - module: "$MODULE"
        - variant: "$VARIANT"
        - build_type: apk
    - deploy-to-bitrise-io@2:
        title: Deploy do bitrise.io (Artifacts)
